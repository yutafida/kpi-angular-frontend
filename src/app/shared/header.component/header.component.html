<!-- ═══════════════════════════════════════════════════════════
     PAGE HERO BANNER (app-header component)
     HCI: Removed redundant status (now only in nav bar),
     stronger NAF identity, clearer title hierarchy,
     motivational motto for institutional authenticity
     ═══════════════════════════════════════════════════════════ -->
<div class="relative overflow-hidden bg-gradient-to-br from-[#001a3d] via-[#00264d] to-[#003366] rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.25)] border border-[#D4AF37]/10 mb-8">

  <!-- Subtle Grid Overlay (reduced opacity — less visual noise) -->
  <div class="absolute inset-0 opacity-[0.04] bg-[linear-gradient(to_right,#ffffff_1px,transparent_1px),linear-gradient(to_bottom,#ffffff_1px,transparent_1px)] bg-[size:32px_32px]"></div>

  <!-- Vignette for depth -->
  <div class="absolute inset-0 bg-gradient-to-t from-black/25 via-transparent to-transparent pointer-events-none"></div>

  <!-- Top gold accent -->
  <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent"></div>

  <!-- Corner brackets (tactical HUD feel — subtle) -->
  <div class="absolute top-3 left-3 w-5 h-5 border-t-2 border-l-2 border-[#D4AF37]/30 rounded-tl-sm"></div>
  <div class="absolute top-3 right-3 w-5 h-5 border-t-2 border-r-2 border-[#D4AF37]/30 rounded-tr-sm"></div>
  <div class="absolute bottom-3 left-3 w-5 h-5 border-b-2 border-l-2 border-[#D4AF37]/30 rounded-bl-sm"></div>
  <div class="absolute bottom-3 right-3 w-5 h-5 border-b-2 border-r-2 border-[#D4AF37]/30 rounded-br-sm"></div>

  <div class="relative px-5 py-6 sm:px-8 sm:py-8">

    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-5">

      <!-- ── Left: Content ── -->
      <div class="flex items-start gap-4 sm:gap-5 z-10 min-w-0">

        <!-- Wing/Eagle Icon -->
        <div class="relative w-12 h-12 sm:w-14 sm:h-14 rounded-lg bg-[#D4AF37]/8 border border-[#D4AF37]/20 flex items-center justify-center flex-shrink-0">
          <div class="absolute inset-0 bg-[#D4AF37]/5 rounded-lg blur-md"></div>
          <svg class="relative w-6 h-6 sm:w-7 sm:h-7 text-[#D4AF37]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 006.16-12.12A14.98 14.98 0 009.631 8.41m5.96 5.96a14.926 14.926 0 01-5.841 2.58m-.119-8.54a6 6 0 00-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 00-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 01-2.448-2.448 14.9 14.9 0 01.06-.312m-2.24 2.39a4.493 4.493 0 00-1.757 4.306 4.493 4.493 0 004.306-1.758M16.5 9a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z"/>
          </svg>
        </div>

        <!-- Title Block -->
        <div class="flex flex-col min-w-0">
          <div class="flex items-center gap-2.5 mb-1.5 flex-wrap">
            <h1 class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-white tracking-tight leading-none">
              {{ title }}
            </h1>
            <!-- NAF Badge -->
            <span class="inline-flex items-center text-[9px] font-black uppercase tracking-[0.22em] text-[#00264d] bg-[#D4AF37] px-2 py-0.5 rounded-[2px] shadow-sm flex-shrink-0">
              NAF
            </span>
          </div>

          @if (subtitle) {
            <p class="text-blue-200/60 font-medium tracking-wide text-xs sm:text-[13px] flex items-center gap-2">
              <span class="w-1 h-1 rounded-full bg-[#D4AF37]/70 flex-shrink-0"></span>
              <span class="truncate">{{ subtitle }}</span>
            </p>
          }
        </div>
      </div>

      <!-- ── Right: Motto + Decorative ──
           NAF Motto adds institutional authenticity
           Removed redundant "System Status" (already in nav bar) -->
      <div class="hidden sm:flex flex-col items-end gap-2 z-10 border-l border-white/8 pl-5 flex-shrink-0">

        <!-- NAF Motto -->
        <div class="text-right">
          <div class="text-[9px] font-bold text-[#D4AF37]/60 uppercase tracking-[0.25em] mb-0.5">Motto</div>
          <div class="text-sm font-extrabold text-white/90 tracking-[0.08em] uppercase">
            Willing · Able · Ready
          </div>
        </div>

        <!-- Decorative rank stars -->
        <div class="flex items-center gap-1.5 mt-1">
          <div class="w-1 h-1 bg-[#D4AF37]/50 rotate-45"></div>
          <div class="w-1 h-1 bg-[#D4AF37]/50 rotate-45"></div>
          <div class="w-1 h-1 bg-[#D4AF37]/50 rotate-45"></div>
        </div>

        <!-- Thin decorative line -->
        <div class="flex gap-0.5 mt-0.5">
          <div class="h-px w-10 bg-white/8"></div>
          <div class="h-px w-3 bg-[#D4AF37]/30"></div>
          <div class="h-px w-1.5 bg-white/8"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom accent -->
  <div class="absolute bottom-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-[#D4AF37]/15 to-transparent"></div>
</div>
